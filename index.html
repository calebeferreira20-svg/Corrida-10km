  h+=`<div class="panel" style="border-color:${ZC.z2}40">
    <div class="panel-lbl" style="color:${ZC.z2}">Por que a proteína caiu um pouco</div>
    <div class="panel-body">Antes calculava por peso total (83kg × 2,1g/kg = 174g). Agora que você tem uma estimativa de % de gordura, o cálculo ficou mais preciso: <b>2,3g/kg de massa magra</b> (≈68,5kg de massa magra, de 84kg a ~18,5% de gordura) = ~158g. É mais exato, não é redução real — o carboidrato que "sobrou" foi realocado, o total de calorias do dia não mudou.</div>
  </div>
  <div class="panel" style="border-color:${ZC.z4}40">
    <div class="panel-lbl" style="color:${ZC.z4}">Sobre o déficit</div>
    <div class="panel-body">Esses números embutem um déficit <b>moderado</b> (~400–500 kcal), não agressivo. Com corrida chegando a 70 km/semana mais musculação 5×, um déficit forte derruba recuperação, aumenta risco de lesão e compromete a prova — o oposto do que você quer. Se aparecer queda de performance, sono ruim ou dores persistentes, o ajuste é reduzir o déficit, não aumentar.</div>
  </div>
  <div class="panel">
    <div class="panel-lbl" style="color:var(--gold)">Como classificar o dia</div>
    <div class="panel-body">
      <b>Leve</b> — regenerativo, ou dia de push/pull sem corrida forte.<br>
      <b>Forte</b> — intervalado, limiar, longão, ou qualquer dia que inclua legs.<br>
      <b>Descanso</b> — dia sem corrida e sem musculação.
    </div>
  </div>
  <div class="panel">
    <div class="panel-lbl" style="color:${ZC.z2}">Hidratação</div>
    <div class="panel-body">Longões e limiares acima de 60 min pedem água <b>com eletrólito</b>, não só água. Em Brasília seca a perda de líquido é maior do que o suor visível sugere.</div>
  </div>`;
  document.getElementById("content").innerHTML=h;
}

function viewDiario(){
  if(!S.diarioDate) S.diarioDate = isoLocal(new Date());
  const date = new Date(S.diarioDate+"T00:00:00");
  const key = S.diarioDate;
  const wd = weekDayFor(date);
  const week = wd ? WEEKS.find(w=>w.n===wd.weekN) : null;
  const tier = week ? getDayTier(week, wd.dayName) : "Leve";
  const c = TIER_COLOR[tier];
  const totals = dayTotals(key);
  const target = dayTargetKcal(tier);
  const entries = diary[key]||[];
  const isToday = sameDay(date, new Date());

  let h=`<div class="section-head">
    <div class="section-eyebrow">Diário alimentar</div>
    <div class="section-title">O que você realmente comeu</div>
    <div class="section-note">Base local no padrão TACO — busca o alimento, informa a quantidade do jeito que for mais fácil (g, ml, unidade, fatia, colher, xícara...). O que não estiver na base, a IA estima.</div>
  </div>`;

  h+=`<div class="daynavrow">
    <button class="daynavbtn" data-daynav="-1">‹</button>
    <div class="daynavcenter">
      <div class="daynavdate">${String(date.getDate()).padStart(2,"0")}/${String(date.getMonth()+1).padStart(2,"0")}${isToday?" · hoje":""}</div>
      <div class="daynavdow">${wd?wd.dayName:"fora do ciclo"}${week?` · Semana ${week.n}`:""}</div>
    </div>
    <button class="daynavbtn" data-daynav="1">›</button>
  </div>`;

  h+=`<div class="chartcard">
    <div class="chart-title">Consumido hoje${tier?` · <span style="color:${c}">${tier}</span>`:""}</div>
    <div class="nut-macros" style="margin-top:4px">
      <div class="macro"><div class="macro-lbl">Kcal</div><div class="macro-val" style="color:var(--gold)">${Math.round(totals.kcal)}</div><div class="macro-per">meta ~${target}</div></div>
      <div class="macro"><div class="macro-lbl">Proteína</div><div class="macro-val">${Math.round(totals.prot)}g</div></div>
      <div class="macro"><div class="macro-lbl">Carbo</div><div class="macro-val">${Math.round(totals.carb)}g</div></div>
    </div>
  </div>`;

  h+=`<div class="chartcard">
    <div class="chart-title">Registrado nesse dia</div>
    ${entries.length?`<div class="diaryrows">${entries.map(e=>`
      <div class="diaryrow">
        <div class="diaryrow-main">
          <div class="diaryrow-name">${esc(e.food)}${e.estimated?` <span style="color:var(--gold)">${icon("sparkle",10)}</span>`:""}</div>
          <div class="diaryrow-sub">${e.qty}${(e.unit==="g"||e.unit==="ml")?e.unit:` ${e.unit} (${e.grams}g)`} · C${e.carb} P${e.prot} G${e.fat}</div>
        </div>
        <div class="diaryrow-kcal">${e.kcal}<span class="u">kcal</span></div>
        <button class="diaryrow-del" data-delfood="${e.id}">${icon("trash",13)}</button>
      </div>`).join("")}</div>`
      :`<div class="chart-empty"><div class="ce-ico">${icon("meal",22)}</div>Nada registrado ainda nesse dia.</div>`}
  </div>`;

  h+=`<div class="chartcard">
    <div class="chart-title">${icon("search",13)} Adicionar alimento</div>
    <div class="chart-sub">Digita o nome (a lista sugere da base local) e a quantidade — se não achar na base, clica em Adicionar mesmo assim que eu peço uma estimativa por IA.</div>
    <div class="foodform">
      <input list="foodlist" id="foodInput" class="foodinput" placeholder="Ex: peito de frango, arroz, pão de forma...">
      <datalist id="foodlist">${allFoods().map(f=>`<option value="${esc(f.name)}">`).join("")}</datalist>
      <div class="foodqtyrow">
        <input type="number" id="foodQty" class="foodqty" placeholder="Qtd" min="0" step="0.5" value="100">
        <select id="foodUnit" class="foodunit">
          <option value="g">gramas</option>
          <option value="ml">ml</option>
          <option value="unidade">unidade</option>
          <option value="fatia">fatia</option>
          <option value="colher">colher de sopa</option>
          <option value="xicara">xícara</option>
          <option value="concha">concha</option>
          <option value="copo">copo</option>
          <option value="pote">pote</option>
          <option value="lata">lata</option>
          <option value="dose">dose/scoop</option>
          <option value="punhado">punhado</option>
        </select>
      </div>
      <button class="btn-primary" data-addfood>${icon("plus",13)} Adicionar</button>
      <div id="aiStatus" class="ai-status"></div>
    </div>
  </div>`;

  h+=`<div class="chartcard">
    <div class="chart-title">Balanço da semana${week?` ${week.n}`:""}</div>
    <div class="chart-sub">Consumido = registrado aqui · Meta = plano de refeições · Gasto ativo = real, do Strava</div>`;
  if(week){
    const b=weekFoodBalance(week.n);
    h+=`<div class="stattiles" style="margin-top:12px">
      <div class="stile"><div class="stile-lbl">Consumido</div><div class="stile-val">${b.consumed}<span class="u">kcal</span></div></div>
      <div class="stile"><div class="stile-lbl">Meta</div><div class="stile-val">${b.target}<span class="u">kcal</span></div></div>
      <div class="stile"><div class="stile-lbl">Gasto ativo</div><div class="stile-val">${b.burned}<span class="u">kcal</span></div></div>
    </div>`;
  } else {
    h+=`<div class="chart-empty">Fora do período do ciclo.</div>`;
  }
  h+=`</div>`;

  h+=`<div class="panel">
    <div class="panel-lbl" style="color:var(--gold)">Sobre esses números</div>
    <div class="panel-body">"Consumido" é 100% o que você registrou aqui — nada é assumido. "Meta" é a soma da Opção 1 de cada refeição sugerida pro nível do dia. "Gasto ativo" vem só do treino (Strava), não inclui seu metabolismo basal — não é pra bater exatamente com "meta", é referência pra ver se o padrão real tá muito longe do planejado.</div>
  </div>`;

  document.getElementById("content").innerHTML=h;
  document.querySelectorAll("[data-daynav]").forEach(b=>b.onclick=()=>{
    S.diarioDate = isoLocal(addD(date, +b.dataset.daynav));
    render();
  });
  document.querySelectorAll("[data-delfood]").forEach(b=>b.onclick=()=>{ removeDiaryEntry(key, b.dataset.delfood); render(); });
  const addBtn=document.querySelector("[data-addfood]");
  if(addBtn) addBtn.onclick=()=>{
    const nameEl=document.getElementById("foodInput"), qtyEl=document.getElementById("foodQty"), unitEl=document.getElementById("foodUnit");
    const name=nameEl.value.trim(), qty=parseFloat(qtyEl.value)||0, unit=unitEl.value;
    const statusEl=document.getElementById("aiStatus");
    if(!name||qty<=0){ if(statusEl) statusEl.textContent="Preenche o nome e uma quantidade maior que zero."; return; }
    const food=allFoods().find(f=>f.name.toLowerCase()===name.toLowerCase());
    if(food){ addDiaryEntry(key, computeFoodEntry(food,qty,unit)); render(); return; }
    aiEstimateAndAdd(name, qty, unit, key);
  };
}

function viewCardapio(){
  const week = WEEKS[S.wk];
  let h=`<div class="section-head">
    <div class="section-eyebrow">Nutrição por dia</div>
    <div class="section-title">Cardápio · Semana ${week.n}</div>
    <div class="section-note">O nível de cada dia (Descanso/Leve/Forte/Taper) já vem do treino real daquele dia nessa semana — muda sozinho conforme o ciclo avança. 2 opções por refeição, escolha a que preferir no dia.</div>
  </div>`;

  h+=`<div id="weekrail"><div class="row">`;
  WEEKS.forEach((w,i)=>{
    h+=`<button class="wk ${S.wk===i?"on":""}" data-wk="${i}"><div class="wk-n">S${w.n}</div><div class="wk-s">${w.tag||""}</div></button>`;
  });
  h+=`</div></div>`;

  const DAY_ORDER2 = ["Segunda","Terça","Quarta","Quinta","Sexta","Sábado","Domingo"];
  DAY_ORDER2.forEach(day=>{
    const tier = getDayTier(week, day);
    const c = TIER_COLOR[tier];
    const run = week.sessions.find(s=>s.day===day);
    const dk = `card-${week.n}-${day}`;
    const open = S.open.has(dk);
    h+=`<div class="card">
      <div class="card-head" data-t="${dk}">
        <div class="zstripe" style="background:${c}"></div>
        <div class="card-main">
          <div class="card-toprow"><span class="daytag">${day.slice(0,3).toUpperCase()}</span><span class="card-title">${esc(day)}</span></div>
          <div class="card-stats">
            <span class="zpill" style="background:${c}1F;color:${c}">${tier}</span>
            ${run?`<span class="stat-pace" style="color:var(--text-3)">${esc(run.title)}</span>`:""}
          </div>
        </div>
        <div class="card-right"><span class="chev ${open?"open":""}">▼</span></div>
      </div>
      <div class="card-body ${open?"open":""}">`;
    ["Café da manhã","Almoço","Lanche da tarde","Jantar","Ceia"].forEach(meal=>{
      const opts = MEAL_PLAN[tier][meal];
      h+=`<div style="margin-bottom:16px">
        <div class="pacebox-lbl" style="margin-bottom:8px">${esc(meal)}</div>`;
      opts.forEach((opt,oi)=>{
        h+=`<div style="background:var(--surface-2);border-radius:10px;padding:11px 13px;margin-bottom:7px">
          <div style="font-size:11px;color:${c};font-weight:700;margin-bottom:5px">Opção ${oi+1}</div>
          <div style="font-size:12.5px;color:var(--text-2);line-height:1.7;margin-bottom:7px">${opt.items.map(esc).join(" + ")}</div>
          <div style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-3)">${opt.m.kcal}kcal · C${opt.m.carb}g · P${opt.m.prot}g · G${opt.m.fat}g</div>
        </div>`;
      });
      h+=`</div>`;
    });
    if(tier==="Forte"||tier==="Taper"){
      h+=`<div class="pacebox-note" style="margin-top:2px">${icon("pill",11)} Se o treino do dia passar de 60-70min (limiar/longão), leva 1 sachê de carbogel a cada 45-60min durante o treino — não substitui as refeições, é reposição intra-treino.</div>`;
    }
    if(tier==="Carga de Carboidrato"){
      h+=`<div class="pacebox-note" style="margin-top:2px">${icon("refresh",11)} Treino baixo de propósito nesses 3 dias — é isso que permite o corpo estocar glicogênio em vez de gastar. A comida parece pesada pro esforço do dia mesmo: é a ideia. Volta pro normal só depois da prova de domingo.</div>`;
    }
    h+=`</div></div>`;
  });

  document.getElementById("content").innerHTML=h;
  document.querySelectorAll("[data-wk]").forEach(b=>b.onclick=()=>{ S.wk=+b.dataset.wk; render(); });
  document.querySelectorAll("[data-t]").forEach(e=>e.onclick=()=>{
    const k=e.dataset.t; S.open.has(k)?S.open.delete(k):S.open.add(k); render();
  });
}

function render(){
  header();
  ({ plan:viewPlan, evolucao:viewEvolution, musculacao:viewStrength, cardapio:viewCardapio, diario:viewDiario, overview:viewOverview,
     fases:viewPhases, zonas:viewZones, nutricao:viewNutrition })[S.view]();
}

function start(){
  render();
  if(window.claude && window.claude.use){
    window.claude.use("db").then(db=>{
      if(!db) return;
      DB = db;
      DB.doc("progress/store").get().then(snap=>{
        if(snap.exists && snap.data()){
          // Mescla o que veio do servidor com qualquer marcação feita localmente
          // nesse intervalo de carregamento — evita perder cliques rápidos.
          store = {...snap.data(), ...store};
          render();
          DB.doc("progress/store").set(store).catch(()=>{});
        } else if(Object.keys(store).length){
          DB.doc("progress/store").set(store).catch(()=>{});
        }
        dbReady = true;
      }).catch(()=>{});
      DB.doc("diario/log").get().then(snap=>{
        if(snap.exists && snap.data()){
          diary = {...snap.data(), ...diary};
          if(S.view==="diario") render();
          DB.doc("diario/log").set(diary).catch(()=>{});
        } else if(Object.keys(diary).length){
          DB.doc("diario/log").set(diary).catch(()=>{});
        }
      }).catch(()=>{});
    }).catch(()=>{});
    window.claude.use("sample").then(s=>{ SAMPLE=s; }).catch(()=>{});
  }
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start();
setInterval(()=>{ if(S.view==="plan"&&!S.editing) header(); }, 60000);
</script>

<script>
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
</script>
