<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Meia Maratona Brasília · 22.11.26</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Meia BSB">
<meta name="theme-color" content="#08080A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:        #08080A;
    --surface:   #121216;
    --surface-2: #1A1A20;
    --line:      #26262E;
    --line-soft: #1D1D24;
    --text:      #F2F2F5;
    --text-2:    #A8A8B4;
    --text-3:    #6E6E7C;
    --gold:      #F5C518;
    --z2:        #3DD6C0;
    --z3:        #5B9BF0;
    --z4:        #F5A623;
    --z5:        #F2564B;
    --ok:        #46D28A;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    min-height:100vh; background:var(--bg); color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    font-size:13px; line-height:1.5;
    padding-bottom:40px;
    -webkit-tap-highlight-color:transparent;
    -webkit-font-smoothing:antialiased;
  }
  button,input{ font-family:inherit; font-size:inherit; color:inherit; }
  button{ -webkit-appearance:none; appearance:none; border:none; background:none; cursor:pointer; }
  :focus-visible{ outline:2px solid var(--gold); outline-offset:2px; border-radius:4px; }
  .wrap{ max-width:760px; margin:0 auto; }

  #header{
    background:linear-gradient(180deg,#0D0D11 0%,#08080A 100%);
    border-bottom:1px solid var(--line);
    padding:22px 18px 0;
    position:sticky; top:0; z-index:80;
  }
  .brandrow{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:20px; }
  .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:9.5px; letter-spacing:.22em; text-transform:uppercase;
    color:var(--gold); font-weight:700; margin-bottom:7px;
  }
  .title{
    font-family:'Archivo',sans-serif; font-weight:900;
    font-size:26px; line-height:.98; letter-spacing:-.02em;
  }
  .subtitle{ font-size:11px; color:var(--text-3); margin-top:7px; }
  .countdown{ text-align:right; flex-shrink:0; }
  .cd-num{
    font-family:'Archivo',sans-serif; font-weight:900;
    font-size:39.5px; line-height:.9; color:var(--gold); letter-spacing:-.03em;
  }
  .cd-lbl{
    font-family:'JetBrains Mono',monospace;
    font-size:8.5px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--text-3); margin-top:5px;
  }

  #kpis{ display:grid; grid-template-columns:repeat(3,1fr); gap:9px; margin-bottom:18px; }
  .kpi{ background:var(--surface); border:1px solid var(--line-soft); border-radius:12px; padding:12px 13px; }
  .kpi-lbl{ font-family:'JetBrains Mono',monospace; font-size:8.5px; letter-spacing:.13em; text-transform:uppercase; color:var(--text-3); margin-bottom:6px; }
  .kpi-val{ font-family:'Archivo',sans-serif; font-weight:800; font-size:18px; line-height:1; letter-spacing:-.01em; }
  .kpi-sub{ font-size:9.5px; color:var(--text-3); margin-top:4px; }
  .kpi-bar{ height:3px; background:var(--surface-2); border-radius:2px; margin-top:8px; overflow:hidden; }
  .kpi-bar span{ display:block; height:100%; background:var(--gold); border-radius:2px; transition:width .5s; }

  #tabs{ display:flex; overflow-x:auto; gap:2px; scrollbar-width:none; }
  #tabs::-webkit-scrollbar{ display:none; }
  .tab{
    flex-shrink:0; padding:13px 14px 12px;
    font-family:'Archivo',sans-serif; font-weight:700;
    font-size:10.5px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--text-3); border-bottom:2.5px solid transparent;
    transition:color .18s;
  }
  .tab.on{ color:var(--gold); border-bottom-color:var(--gold); }

  #content{ padding:20px 18px 0; }

  .section-head{ margin-bottom:18px; }
  .section-eyebrow{ font-family:'JetBrains Mono',monospace; font-size:9px; letter-spacing:.2em; text-transform:uppercase; color:var(--gold); font-weight:700; margin-bottom:6px; }
  .section-title{ font-family:'Archivo',sans-serif; font-weight:800; font-size:20.5px; line-height:1.05; letter-spacing:-.02em; }
  .section-note{ font-size:11px; color:var(--text-2); margin-top:8px; line-height:1.55; }

  #weekrail{ overflow-x:auto; scrollbar-width:none; margin:0 -18px 18px; padding:0 18px 4px; }
  #weekrail::-webkit-scrollbar{ display:none; }
  #weekrail .row{ display:flex; gap:7px; min-width:max-content; }
  .wk{ min-width:56px; padding:10px 11px; border-radius:11px; background:var(--surface); border:1px solid var(--line-soft); text-align:center; transition:all .18s; }
  .wk.on{ background:var(--surface-2); border-color:var(--gold); }
  .wk-n{ font-family:'Archivo',sans-serif; font-weight:800; font-size:13px; }
  .wk.on .wk-n{ color:var(--gold); }
  .wk-s{ font-family:'JetBrains Mono',monospace; font-size:8.5px; color:var(--text-3); margin-top:3px; }

  .weekcard{ background:var(--surface); border:1px solid var(--line-soft); border-radius:14px; padding:16px 17px; margin-bottom:18px; }
  .weekcard-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:14px; margin-bottom:14px; }
  .wc-name{ font-family:'Archivo',sans-serif; font-weight:800; font-size:16.5px; letter-spacing:-.01em; }
  .wc-meta{ font-size:11px; color:var(--text-3); margin-top:4px; }
  .wc-tag{ display:inline-block; margin-top:8px; font-family:'JetBrains Mono',monospace; font-size:8.5px; letter-spacing:.16em; padding:4px 9px; border-radius:5px; font-weight:700; }
  .wc-vol{ text-align:right; flex-shrink:0; }
  .wc-vol-n{ font-family:'Archivo',sans-serif; font-weight:900; font-size:26px; line-height:.9; color:var(--gold); letter-spacing:-.02em; }
  .wc-vol-l{ font-family:'JetBrains Mono',monospace; font-size:8.5px; letter-spacing:.13em; color:var(--text-3); margin-top:5px; text-transform:uppercase; }
  .volbar{ height:5px; background:var(--surface-2); border-radius:3px; overflow:hidden; }
  .volbar span{ display:block; height:100%; border-radius:3px; transition:width .5s; }
  .volnote{ font-family:'JetBrains Mono',monospace; font-size:9px; color:var(--text-3); margin-top:7px; }

  #dayfilter{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px; }
  .dayf{ padding:8px 12px; border-radius:9px; background:var(--surface); border:1px solid var(--line-soft); font-family:'JetBrains Mono',monospace; font-size:9.5px; letter-spacing:.09em; color:var(--text-3); font-weight:500; transition:all .18s; }
  .dayf.on{ font-weight:700; }

  .card{ background:var(--surface); border:1px solid var(--line-soft); border-radius:14px; margin-bottom:11px; overflow:hidden; transition:border-color .2s; }
  .card.done{ border-color:rgba(70,210,138,.28); background:#0F1613; }
  .card-head{ display:flex; align-items:center; gap:13px; padding:15px 16px; cursor:pointer; }
  .zstripe{ width:4px; align-self:stretch; border-radius:3px; flex-shrink:0; }
  .card-main{ flex:1; min-width:0; }
  .card-toprow{ display:flex; align-items:center; gap:9px; margin-bottom:6px; }
  .daytag{ font-family:'JetBrains Mono',monospace; font-size:8.5px; font-weight:700; letter-spacing:.14em; color:var(--text-3); }
  .card-title{ font-family:'Archivo',sans-serif; font-weight:700; font-size:14px; letter-spacing:-.01em; }
  .card-stats{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .stat-km{ font-family:'Archivo',sans-serif; font-weight:800; font-size:13px; }
  .stat-pace{ font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:500; }
  .zpill{ font-family:'JetBrains Mono',monospace; font-size:8.5px; font-weight:700; letter-spacing:.1em; padding:3px 7px; border-radius:5px; }
  .card-right{ display:flex; align-items:center; gap:11px; flex-shrink:0; }
  .chev{ color:var(--text-3); font-size:10.5px; transition:transform .2s; }
  .chev.open{ transform:rotate(180deg); }
  .check{ width:34px; height:34px; border-radius:50%; flex-shrink:0; border:2px solid var(--line); display:flex; align-items:center; justify-content:center; transition:all .2s; font-size:13px; font-weight:900; }
  .check.on{ background:var(--ok); border-color:var(--ok); color:#08080A; }

  .card-body{ display:none; border-top:1px solid var(--line-soft); padding:16px; }
  .card-body.open{ display:block; }

  .pacebox{ background:var(--surface-2); border-radius:11px; padding:14px 15px; margin-bottom:14px; }
  .pacebox-lbl{ font-family:'JetBrains Mono',monospace; font-size:8.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--text-3); margin-bottom:11px; }
  .pacebox-row{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; }
  .pacebox-hr{ font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--text-2); }
  .pacebox-pace{ font-family:'Archivo',sans-serif; font-weight:900; font-size:22.5px; letter-spacing:-.02em; }
  .pacebox-pace .u{ font-family:'JetBrains Mono',monospace; font-size:9.5px; font-weight:400; color:var(--text-3); margin-left:3px; }
  .pacebox-note{ margin-top:12px; padding-top:11px; border-top:1px solid var(--line); font-size:11px; color:var(--text-2); line-height:1.6; }

  .steps{ margin-bottom:14px; }
  .step{ display:flex; gap:10px; margin-bottom:8px; font-size:11.5px; color:var(--text-2); line-height:1.55; }
  .step-b{ flex-shrink:0; font-weight:700; }

  .logbox{ padding:13px 14px; border-radius:11px; background:var(--surface-2); border:1px dashed var(--line); cursor:pointer; transition:border-color .2s; }
  .logbox-empty{ font-size:11px; color:var(--text-3); }
  .logbox-filled{ font-size:11.5px; color:var(--text-2); line-height:1.75; }
  .logbox-filled b{ color:var(--text); font-weight:600; }

  .editform{ display:flex; flex-direction:column; gap:9px; }
  .editrow{ display:flex; gap:9px; }
  .editform input{ flex:1; padding:12px 13px; border-radius:9px; background:var(--surface-2); border:1px solid var(--line); color:var(--text); font-size:12px; outline:none; width:100%; }
  .editform input::placeholder{ color:var(--text-3); }
  .editform input:focus{ border-color:var(--gold); }
  .editform input.narrow{ flex:0 0 108px; }
  .editbtns{ display:flex; gap:9px; margin-top:2px; }
  .btn-primary{ flex:1; padding:13px; border-radius:10px; background:var(--gold); color:#08080A; font-family:'Archivo',sans-serif; font-weight:800; font-size:12px; letter-spacing:.01em; }
  .btn-ghost{ padding:13px 20px; border-radius:10px; border:1px solid var(--line); color:var(--text-2); font-size:12px; font-weight:500; }

  .nav{ display:flex; gap:9px; margin-top:16px; }
  .nav button{ flex:1; padding:14px; border-radius:11px; background:var(--surface); border:1px solid var(--line-soft); color:var(--text-2); font-size:12px; font-weight:500; }
  .nav button:disabled{ color:var(--text-3); opacity:.4; }

  .progwrap{ margin-top:22px; background:var(--surface); border:1px solid var(--line-soft); border-radius:14px; padding:16px; }
  .progwrap .lbl{ font-family:'JetBrains Mono',monospace; font-size:8.5px; letter-spacing:.18em; text-transform:uppercase; color:var(--text-3); margin-bottom:13px; }
  .progrow{ display:flex; gap:4px; }
  .progcol{ flex:1; cursor:pointer; }
  .progbar{ height:48px; background:var(--surface-2); border-radius:6px; position:relative; overflow:hidden; }
  .progfill{ position:absolute; bottom:0; left:0; right:0; transition:height .5s; }
  .progsel{ position:absolute; inset:0; border-radius:6px; border:2px solid var(--gold); }
  .progn{ font-family:'JetBrains Mono',monospace; font-size:8.5px; color:var(--text-3); text-align:center; margin-top:5px; }

  .ovweek{ margin-bottom:20px; }
  .ovhead{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .ovname{ font-family:'Archivo',sans-serif; font-weight:700; font-size:12.5px; }
  .ovmeta{ font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--text-3); }
  .ovgrid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .ovcell{ padding:12px 9px; border-radius:11px; text-align:center; background:var(--surface); border:1px solid var(--line-soft); cursor:pointer; }
  .ovcell.done{ background:#0F1613; border-color:rgba(70,210,138,.28); }
  .ovday{ font-family:'JetBrains Mono',monospace; font-size:8.5px; letter-spacing:.12em; color:var(--text-3); font-weight:700; }
  .ovkm{ font-family:'Archivo',sans-serif; font-weight:800; font-size:14.5px; margin-top:5px; }
  .ovtype{ font-size:9px; color:var(--text-3); margin-top:3px; }

  .panel{ background:var(--surface); border:1px solid var(--line-soft); border-radius:14px; padding:17px; margin-bottom:11px; }
  .panel-lbl{ font-family:'JetBrains Mono',monospace; font-size:8.5px; letter-spacing:.18em; text-transform:uppercase; font-weight:700; margin-bottom:11px; }
  .panel-body{ font-size:11.5px; color:var(--text-2); line-height:1.85; }
  .panel-body b{ color:var(--text); font-weight:600; }

  .phase{ background:var(--surface); border-left:3px solid; border-radius:12px; padding:16px 17px; margin-bottom:11px; }
  .phase-top{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:7px; }
  .phase-name{ font-family:'Archivo',sans-serif; font-weight:800; font-size:14.5px; }
  .phase-freq{ font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--text-3); }
  .phase-range{ font-family:'JetBrains Mono',monospace; font-size:9.5px; color:var(--text-3); margin-bottom:10px; }
  .phase-desc{ font-size:11.5px; color:var(--text-2); line-height:1.65; margin-bottom:10px; }
  .phase-vol{ font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--text-2); }

  .zonecard{ background:var(--surface); border:1px solid var(--line-soft); border-radius:13px; padding:16px; margin-bottom:10px; }
  .zonetop{ display:flex; align-items:center; gap:14px; }
  .zbadge{ width:46px; height:46px; border-radius:11px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-family:'Archivo',sans-serif; font-weight:900; font-size:14px; }
  .zinfo{ flex:1; min-width:0; }
  .zrow1{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
  .zname{ font-family:'Archivo',sans-serif; font-weight:700; font-size:14px; }
  .zpace{ font-family:'Archivo',sans-serif; font-weight:800; font-size:14.5px; }
  .zpace .u{ font-family:'JetBrains Mono',monospace; font-size:8.5px; font-weight:400; color:var(--text-3); }
  .zhr{ font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--text-3); margin-top:3px; }
  .zdesc{ font-size:11px; color:var(--text-2); margin-top:7px; line-height:1.5; }

  .nutcard{ background:var(--surface); border:1px solid var(--line-soft); border-radius:13px; padding:16px; margin-bottom:11px; }
  .nut-tier{ font-family:'Archivo',sans-serif; font-weight:800; font-size:14px; margin-bottom:3px; }
  .nut-kcal{ font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--text-3); margin-bottom:14px; }
  .nut-macros{ display:grid; grid-template-columns:repeat(3,1fr); gap:9px; }
  .macro{ background:var(--surface-2); border-radius:10px; padding:11px 12px; }
  .macro-lbl{ font-family:'JetBrains Mono',monospace; font-size:8.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--text-3); margin-bottom:6px; }
  .macro-val{ font-family:'Archivo',sans-serif; font-weight:800; font-size:15.5px; }
  .macro-per{ font-family:'JetBrains Mono',monospace; font-size:9px; color:var(--text-3); margin-top:3px; }

  .strcard{ background:var(--surface); border:1px solid var(--line-soft); border-radius:14px; margin-bottom:11px; overflow:hidden; }
  .strcard.rest{ opacity:.6; }
  .strcard.done{ border-color:rgba(70,210,138,.28); background:#0F1613; }
  .str-head{ display:flex; align-items:center; gap:13px; padding:15px 16px; }
  .str-code{ width:44px; height:44px; border-radius:11px; flex-shrink:0; display:flex; align-items:center; justify-content:center; background:var(--surface-2); border:1px solid var(--line); font-family:'Archivo',sans-serif; font-weight:900; font-size:12px; color:var(--gold); }
  .str-main{ flex:1; min-width:0; }
  .str-title{ font-family:'Archivo',sans-serif; font-weight:700; font-size:14px; }
  .str-paired{ font-family:'JetBrains Mono',monospace; font-size:9.5px; color:var(--text-3); margin-top:4px; }
  .str-body{ display:none; border-top:1px solid var(--line-soft); padding:15px 16px; }
  .str-body.open{ display:block; }
  .str-focus{ font-size:11px; color:var(--gold); font-weight:600; margin-bottom:11px; line-height:1.5; }
  .str-ex{ display:flex; gap:10px; margin-bottom:8px; font-size:11.5px; color:var(--text-2); }
  .str-int{ margin-top:12px; padding-top:11px; border-top:1px solid var(--line); font-size:11px; color:var(--text-3); }

  .chartcard{ background:var(--surface); border:1px solid var(--line-soft); border-radius:14px; padding:17px 16px 12px; margin-bottom:11px; }
  .chart-title{ font-family:'Archivo',sans-serif; font-weight:800; font-size:14px; margin-bottom:3px; }
  .chart-sub{ font-size:10.5px; color:var(--text-3); margin-bottom:13px; line-height:1.5; }
  .chart-legend{ display:flex; gap:14px; margin-bottom:12px; flex-wrap:wrap; }
  .legend-item{ display:flex; align-items:center; gap:6px; font-family:'JetBrains Mono',monospace; font-size:9.5px; color:var(--text-2); }
  .legend-swatch{ width:10px; height:10px; border-radius:3px; flex-shrink:0; }
  .legend-swatch.ghost{ background:transparent; border:1.5px solid var(--text-3); box-sizing:border-box; }
  .chart-empty{ font-size:11px; color:var(--text-3); text-align:center; padding:26px 10px 30px; line-height:1.6; }
  .chart-empty .ce-ico{ color:var(--line); margin-bottom:8px; }
  .todaypill{ font-family:'JetBrains Mono',monospace; font-size:7.5px; font-weight:800; letter-spacing:.1em; background:var(--gold); color:#08080A; padding:2.5px 6px; border-radius:20px; }
  .shoe-note{ font-size:10.5px; color:var(--text-3); margin-top:4px; display:flex; align-items:center; gap:5px; }

  .stattiles{ display:grid; grid-template-columns:1.3fr 1fr 1fr; gap:8px; margin-bottom:14px; }
  .stile{ background:var(--surface); border:1px solid var(--line-soft); border-radius:12px; padding:12px 13px; position:relative; overflow:hidden; }
  .stile.hero{ background:linear-gradient(160deg,#171408 0%,var(--surface) 68%); border-color:#2E2712; }
  .stile-lbl{ font-size:9.5px; font-weight:600; color:var(--text-3); margin-bottom:7px; }
  .stile-val{ font-family:'Archivo',sans-serif; font-weight:800; font-size:18px; letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
  .stile.hero .stile-val{ font-size:22px; color:var(--gold); }
  .stile-val .u{ font-size:10.5px; font-weight:500; color:var(--text-3); }
  .stile-sub{ font-size:9px; color:var(--text-2); margin-top:4px; font-family:'JetBrains Mono',monospace; }
  .trend{ display:inline-flex; align-items:center; gap:2px; font-weight:700; }
  .trend.up{ color:var(--ok); } .trend.down{ color:var(--z5); }
  .spark{ position:absolute; bottom:0; left:0; right:0; height:20px; opacity:.55; }

  .logrows{ display:flex; flex-direction:column; gap:2px; }
  .logrow{ display:flex; align-items:center; gap:11px; padding:10px 2px; border-bottom:1px solid var(--line-soft); }
  .logrow:last-child{ border-bottom:none; }
  .logrow-main{ flex:1; min-width:0; }
  .logrow-top{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:5px; }
  .logrow-meta{ font-size:9.5px; color:var(--text-3); flex-shrink:0; }
  .logrow-stats{ display:flex; align-items:baseline; gap:9px; flex-wrap:wrap; }
  .logrow-pace{ font-family:'JetBrains Mono',monospace; font-size:12.5px; font-weight:700; font-variant-numeric:tabular-nums; }
  .logrow-sub{ font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--text-3); }
  .delta-pill{ font-family:'JetBrains Mono',monospace; font-size:9.5px; font-weight:700; padding:1.5px 7px; border-radius:20px; }
  .delta-pill.up{ color:var(--ok); background:#46D28A15; } .delta-pill.down{ color:var(--z5); background:#F2564B15; }
  .delta-pill.flat{ color:var(--text-3); background:var(--surface-2); }

const QUALITY_BANK = [

  }},
  { name:"Tiros curtos", make:(core)=>{
    const cycle = 0.6;

  }},
  { name:"Repetições longas", make:(core)=>{
    const cycle = 2.0;
    const reps = Math.max(3, Math.round(core/cycle));
    const workKm = reps*1.6, recKm = reps*0.4;

  }},
  { name:"Escada", make:(core)=>{
    const unit = roundTo(core/32, 50);
    const reps = [1,2,3,4,3,2,1].map(m=>Math.round(unit*m*1000)/1000);
    const workKm = reps.reduce((a,b)=>a+b,0), recKm = workKm;
    return { t:"Intervalado · Escada", real:workKm+recKm, workKm, recKm,

    return { t:"Intervalado · Cruzado", real:workKm+recKm, workKm, recKm,
      d:["2 km aquecimento em Z2", `${reps.map(fmtM).join("-")} forte (Z5), ficando mais rápido a cada tiro conforme a distância cai — recuperação proporcional ao tiro`, "1,5 km desaquecimento"] };

const QUALITY_SHOE = ["Corre Turbo","Adizero EVO SL","Corre Turbo","Corre Turbo","Adizero EVO SL","Corre Turbo","Adizero EVO SL"];
const QUALITY_PHASE_POOLS = {

function qDetails(ph, variantIdx, km){
  const warm = segTime(2, PACE_MIN.z2), cool = segTime(1.5, PACE_MIN.z2);
  if(ph===null){
    const core=Math.max(km-3.5,3);
    const t = sumRanges(warm, segTime(core, PACE_MIN.z2), cool);
    return { t:"Ativação", d:["Base leve com acelerações curtas"], km:2+core+1.5, timeMin:t[0], timeMax:t[1] };
  }
  const core = Math.max(km-3.5, 3);
  const v = QUALITY_BANK[variantIdx % QUALITY_BANK.length];
  const r = v.make(core);
  let workT, recT;
  if(r.isTimeBase){ workT=[r.repsTime*0.5,r.repsTime*0.5]; recT=[r.repsTime*0.5,r.repsTime*0.5]; }
  else { workT=segTime(r.workKm, PACE_MIN.z5); recT=segTime(r.recKm, PACE_MIN.rec); }
  const total = sumRanges(warm, workT, recT, cool);
  return { t:r.t, d:r.d, km: Math.round((2+r.real+1.5)*10)/10, timeMin:total[0], timeMax:total[1] };
}
function tDetails(ph,km){
  const core = Math.max(km-3,3);
  if(ph==="B"){
    const c=Math.round(core*10)/10;
    const warm=segTime(1.5,PACE_MIN.z2), work=segTime(c,PACE_MIN.z4), cool=segTime(1.5,PACE_MIN.z2);
    const total=sumRanges(warm,work,cool);
    return { t:"Limiar · contínuo", d:["1,5 km leve em Z2",`${c} km contínuos em Z4`,"1,5 km desaquecimento"], km:Math.round((1.5+c+1.5)*10)/10, timeMin:total[0], timeMax:total[1] };
  }
  if(ph==="C"||ph==="D"){
    const blockSizeTarget = ph==="C" ? 2 : 3;
    const blocks = Math.max(1, Math.round(core/blockSizeTarget));
    const blockSize = Math.round((core/blocks)*10)/10;
    const real = blocks*blockSize;
    const restMin = ph==="C" ? 2.5 : 2;
    const restTotal = Math.max(0,blocks-1)*restMin;
    const warm=segTime(2,PACE_MIN.z2), work=segTime(real,PACE_MIN.z4), cool=segTime(1.5,PACE_MIN.z2);
    const total=sumRanges(warm,work,cool,[restTotal,restTotal]);
    return { t:`Limiar · blocos de ${blockSizeTarget}km`, d:["2 km aquecimento em Z2",`${blocks}× ${blockSize}km em Z4, com 2${ph==="C"?"–3":""} min de trote entre blocos`,"1,5 km desaquecimento"], km:Math.round((2+real+1.5)*10)/10, timeMin:total[0], timeMax:total[1] };
  }
  const c=Math.round(core*10)/10;
  const warm=segTime(1.5,PACE_MIN.z2), work=segTime(c,PACE_MIN.z4), cool=segTime(1.5,PACE_MIN.z2);
  const total=sumRanges(warm,work,cool);
  return { t:"Limiar leve", d:["1,5 km leve",`${c} km em Z4 controlado`,"1,5 km desaquecimento"], km:Math.round((1.5+c+1.5)*10)/10, timeMin:total[0], timeMax:total[1] };
}

function fmtD(d){ return `${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}`; }
function paceToDec(str){ const [m,s]=str.trim().split(":").map(Number); return m+s/60; }
function minToHM(min){ let h=Math.floor(min/60), m=Math.round(min%60); if(m===60){ m=0; h+=1; } return h>0?`${h}h${String(m).padStart(2,"0")}`:`${m}min`; }
function fmtDuration(lo,hi){
  if(lo==null||hi==null) return "";
  if(Math.round(lo)===Math.round(hi)) return `~${minToHM(lo)}`;
  const hL=Math.floor(lo/60), hH=Math.floor(hi/60);
  if(hL===hH && hL===0) return `${Math.round(lo)}-${Math.round(hi)}min`;
  return `${minToHM(lo)}-${minToHM(hi)}`;
}
function fmtHMS(sec){
  const h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=Math.round(sec%60);
  return h>0 ? `${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}` : `${m}:${String(s).padStart(2,"0")}`;
}

// ── Ícones de linha (substituem emoji) — traço único, herdam cor via currentColor ──
const ICON_PATHS = {

  bike:    '<circle cx="6.3" cy="17" r="3.1"/><circle cx="17.7" cy="17" r="3.1"/><path d="M6.3 17l4-8.5h3.8l3 8.5"/><path d="M9.3 8.5H7.5"/><path d="M14.1 8.5l2.4 5"/>',

  zap:     '<path d="M13 2 4 14h7l-1 8 10-12h-7l1-8z" fill="currentColor" stroke="none"/>',
  mountain:'<path d="M3 19h18M3 19l6-11 3.2 5 2.3-3.2L20 19"/>',
  search:  '<circle cx="10.3" cy="10.3" r="6.3"/><path d="M20 20l-4.8-4.8"/>',
  plus:    '<path d="M12 5v14M5 12h14"/>',

function icon(name, size){
  size=size||14;
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:-3px;flex-shrink:0">${ICON_PATHS[name]||""}</svg>`;

// separa um prefixo de emoji conhecido do título, devolvendo o ícone equivalente pra render
function titleWithIcon(title){
  if(title.indexOf("🏁")===0) return { iconName:"flag", text:title.replace(/^🏁\s*/,"") };
  if(title.indexOf("🚴")===0) return { iconName:"bike", text:title.replace(/^🚴\s*/,"") };

}
function ringSVG(pct, color, label){
  const r=13, circ=2*Math.PI*r, clamped=Math.max(0,Math.min(1,pct));
  const dash=(circ*clamped).toFixed(1);
  return `<svg width="32" height="32" viewBox="0 0 32 32" style="flex-shrink:0">
    <circle cx="16" cy="16" r="${r}" fill="none" stroke="var(--line-soft)" stroke-width="3"/>
    <circle cx="16" cy="16" r="${r}" fill="none" stroke="${color}" stroke-width="3" stroke-dasharray="${dash} ${circ.toFixed(1)}" stroke-linecap="round" transform="rotate(-90 16 16)"/>
    <text x="16" y="19.5" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" font-weight="700" fill="var(--text)">${label}</text>
  </svg>`;
}

// ── Previsão de prova — só com dados próprios, sem comparar com outros atletas (nada de Strava aqui) ──
// Riegel: T2 = T1 · (D2/D1)^1.06 — extrapolação pura de potência, calibrada em corredores de elite/sub-elite.
function riegelPredict(baseDistKm, baseTimeSec, targetDistKm, exp=1.06){
  return baseTimeSec * Math.pow(targetDistKm/baseDistKm, exp);
}
// VDOT (Daniels & Gilbert) — modelo fisiológico de VO2 vs. % de VO2max sustentável por duração.
function vo2AtVelocity(v){ return -4.60 + 0.182258*v + 0.000104*v*v; } // v em m/min
function pctVO2AtTime(tMin){ return 0.8 + 0.1894393*Math.exp(-0.012778*tMin) + 0.2989558*Math.exp(-0.1932605*tMin); }
function vdotFromPerformance(distKm, timeSec){
  const tMin=timeSec/60, v=(distKm*1000)/tMin;
  return vo2AtVelocity(v)/pctVO2AtTime(tMin);
}
function timeForDistanceAtVDOT(vdot, distKm, lo=5, hi=300){
  for(let i=0;i<80;i++){
    const mid=(lo+hi)/2, v=(distKm*1000)/mid;
    const est=vo2AtVelocity(v)/pctVO2AtTime(mid);
    if(est>vdot) lo=mid; else hi=mid;
  }
  return (lo+hi)/2*60;
}
// melhor referência conhecida pra ancorar as fórmulas: usa o teste de 5K/10K do próprio plano se já tiver
// sido registrado (extrapola menos, é mais confiável); senão cai pro PR de 5K conhecido antes do ciclo.
function bestKnownPR(){
  let best={ distKm:5, timeSec:24*60+39, source:"PR de 5K · 24:39 (antes do ciclo, ~20°C no Rio)" };
  WEEKS.forEach(w=>w.sessions.forEach(s=>{
    if(!/Teste de (5K|10K)/.test(s.title)) return;
    const d=gd(w.n,s.day);
    if(d.realKm && d.pace && d.realKm>=best.distKm){
      best={ distKm:d.realKm, timeSec:d.realKm*paceToDec(d.pace)*60, source:`Teste de ${esc(s.title.replace("🏁 Teste de ",""))} · Semana ${w.n}` };
    }
  }));
  return best;
}
function addD(d,n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }
const DAY_OFFSET = {Segunda:0,Terça:1,Quarta:2,Quinta:3,Sexta:4,Sábado:5,Domingo:6};
function sessionDate(weekN,day){ return addD(PLAN_START, (weekN-1)*7 + DAY_OFFSET[day]); }
function sameDay(a,b){ return a.toDateString()===b.toDateString(); }
function isoLocal(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function weekDayFor(date){
  const diffDays = Math.round((date-PLAN_START)/864e5);
  if(diffDays<0) return null;
  const weekN = Math.floor(diffDays/7)+1, dayIdx = diffDays%7;
  const dayName = Object.keys(DAY_OFFSET).find(k=>DAY_OFFSET[k]===dayIdx);
  return { weekN, dayName };
}

const CHECKPOINT_WEEKS = [5, 8, 11];
const TEST_WEEKS = { 5: "5K", 9: "10K" };

function build(){
  const out=[]; let cur=new Date(PLAN_START); let n=1; let tCounter=0;
  PHASES.forEach(ph=>{
    let qCounter=0;
    for(let i=0;i<ph.weeks;i++){
      const t = ph.weeks>1 ? i/(ph.weeks-1) : 1;
      let vol = Math.round(ph.v0 + (ph.v1-ph.v0)*t);
      if(ph.cutWk && (i+1)===ph.cutWk) vol = ph.cutVol;
      const last = (ph.id==="E" && i===ph.weeks-1);
      const ws=new Date(cur), we=addD(ws,6);
      const sessions=[];

      const pattern = PATTERNS[ph.freq];
      const rawKm = pattern.map(p=>Math.round(vol*p.s*10)/10);
      const longCap = ph.id==="D" ? 19.8 : 18.5;
      const longIdx = pattern.findIndex(p=>p.t==="long");
      const qualityIdx = pattern.findIndex(p=>p.t==="quality");
      const tempoIdx = pattern.findIndex(p=>p.t==="tempo");

      let stepKm = rawKm.slice();
      if(!last && stepKm[longIdx] > longCap){
        const overflow = stepKm[longIdx] - longCap;
        stepKm[longIdx] = longCap;
        const otherIdx = pattern.map((_,i)=>i).filter(i=>i!==longIdx);
        const otherShareSum = otherIdx.reduce((a,i)=>a+pattern[i].s,0);
        otherIdx.forEach(i=>{ stepKm[i] = Math.round((stepKm[i] + overflow*(pattern[i].s/otherShareSum))*10)/10; });
      }

      const pool = QUALITY_PHASE_POOLS[ph.id] || [0,1,2,3,4,5,6];
      let qVariantForWeek = 0, qContent = null, tContent = null;
      if(qualityIdx>=0){
        qVariantForWeek = last ? 0 : pool[qCounter % pool.length];
        qContent = last ? qDetails(null,0,stepKm[qualityIdx]) : qDetails(ph.id, qVariantForWeek, stepKm[qualityIdx]);
      }
      if(tempoIdx>=0){ tContent = tDetails(ph.id, stepKm[tempoIdx]); }

      let finalKm = stepKm.slice();
      let adjustIdx = [];
      if(qualityIdx>=0 && qContent){ const diff=qContent.km-stepKm[qualityIdx]; if(Math.abs(diff)>0.001){ finalKm[qualityIdx]=qContent.km; adjustIdx.push({i:qualityIdx,diff}); } }
      if(tempoIdx>=0 && tContent){ const diff=tContent.km-stepKm[tempoIdx]; if(Math.abs(diff)>0.001){ finalKm[tempoIdx]=tContent.km; adjustIdx.push({i:tempoIdx,diff}); } }
      if(adjustIdx.length){
        const totalDiff = adjustIdx.reduce((a,x)=>a+x.diff,0);
        const easyIdx = pattern.map((_,i)=>i).filter(i=>pattern[i].t==="easy");
        const easyShareSum = easyIdx.reduce((a,i)=>a+pattern[i].s,0);
        easyIdx.forEach(i=>{ finalKm[i] = Math.max(2, Math.round((finalKm[i] - totalDiff*(pattern[i].s/easyShareSum))*10)/10); });
      }
      if(!last) qCounter++;
      if(!last) tCounter++;

      pattern.forEach((p,pIdx)=>{
        const km = finalKm[pIdx];
        const zone = TMETA[p.t].z;
        let title,steps,note;
        let qVariantUsed = qVariantForWeek, tVariantUsed = tCounter % TEMPO_SHOE.length;
        let timeMin, timeMax;
        if(p.t==="quality"){
          title=qContent.t; steps=qContent.d; note="Treino mais exigente da semana. Os outros dias existem pra você chegar inteiro nele.";
          timeMin=qContent.timeMin; timeMax=qContent.timeMax;
        }
        else if(p.t==="tempo"){
          title=tContent.t; steps=tContent.d; note="Limiar de verdade: 'confortavelmente desconfortável'. Sem sprint — é resistência ao lactato.";
          timeMin=tContent.timeMin; timeMax=tContent.timeMax;
        }
        else if(p.t==="easy"){
          title="Regenerativo"; steps=[`${km} km inteiros em Z2`,"Se a FC passar de 157, desacelere sem culpa"]; note="Base de tudo. Não é pra cansar.";
          const t=segTime(km,PACE_MIN.z2); timeMin=t[0]; timeMax=t[1];
        }
        else {
          title = ph.id==="D" ? "Longão · pico + ritmo de prova" : "Longão";
          if(ph.id==="D"){
            steps=[`${km} km, sendo o grosso em Z2`,"Últimos 3–4 km em Z3 (ritmo de prova)","Hidrate a partir da metade"];
            const t=sumRanges(segTime(Math.max(km-3.5,0),PACE_MIN.z2), segTime(Math.min(3.5,km),PACE_MIN.z3));
            timeMin=t[0]; timeMax=t[1];
          } else {
            steps=[`${km} km em Z2, pace constante`,"Hidrate a partir da metade"];
            const t=segTime(km,PACE_MIN.z2); timeMin=t[0]; timeMax=t[1];
          }
          note = ph.id==="D" ? "O ritmo de prova entra aqui, dentro do cansaço real." : "Controle a FC, não o pace.";
        }

        let shoe = p.t==="quality" ? QUALITY_SHOE[qVariantUsed] : p.t==="tempo" ? TEMPO_SHOE[tVariantUsed] : SHOE_MAP[p.t];
        sessions.push({ day:p.d, short:p.d.slice(0,3).toUpperCase(), type:p.t, zone, title, km, steps, note, shoe,
                         timeMin:Math.round(timeMin), timeMax:Math.round(timeMax) });
      });

      if(last){
        sessions.forEach(s=>{
          if(s.type!=="long"){
            s.km=Math.max(2,Math.round(s.km*.5)); s.steps=[`${s.km} km bem leves`,"Semana da prova: descanso é treino"]; s.note="Manter as pernas ativas, nada além disso.";
            const t=segTime(s.km,PACE_MIN.z2); s.timeMin=Math.round(t[0]); s.timeMax=Math.round(t[1]);
          }
        });
        const L=sessions.find(s=>s.type==="long");
        if(L){ L.type="race"; L.zone="z3"; L.title="MEIA MARATONA · BRASÍLIA"; L.km=21.1; L.shoe="New Balance Rebel V5 · (vira Adios Pro 4 se destravar antes)";
          L.steps=["Km 0–5 · controlado, deixe a adrenalina passar","Km 5–15 · ritmo sustentável, sem estourar a Z3","Km 15–21 · o que sobrar"];
          const t=segTime(21.1,PACE_MIN.z3); L.timeMin=Math.round(t[0]); L.timeMax=Math.round(t[1]);
          L.note="Pace-alvo final vamos calibrar nas últimas semanas, com dados reais de treino em Brasília."; }
      }

      let displayVol = last ? 21.1 : vol;
      if(TEST_WEEKS[n]==="5K"){
        const Q = sessions.find(s=>s.type==="quality");
        if(Q){ Q.title="🏁 Teste de 5K"; Q.zone="z5"; Q.km=8.5;
          Q.steps=["2 km aquecimento em Z2","5 km em esforço máximo real — sem pausa, sem interromper pra tiro/recuperação","1,5 km desaquecimento"];
          Q.note="Não é intervalado — é teste de verdade, contínuo. Esse tempo vira referência pra recalibrar as zonas no checkpoint dessa semana.";
          const t=sumRanges(segTime(2,PACE_MIN.z2), segTime(5,PACE_MIN.z5), segTime(1.5,PACE_MIN.z2));
          Q.timeMin=Math.round(t[0]); Q.timeMax=Math.round(t[1]);
          displayVol = Math.round(sessions.reduce((a,s)=>a+s.km,0)*10)/10; }
      }
      if(TEST_WEEKS[n]==="10K"){
        const Tp = sessions.find(s=>s.type==="tempo");
        if(Tp){ Tp.title="🏁 Teste de 10K"; Tp.zone="z4"; Tp.km=11.5;
          Tp.steps=["1,5 km aquecimento em Z2","10 km contínuos no esforço mais forte que sustentar sem quebrar","Sem pausa — é teste, não intervalado"];
          Tp.note="Referência direta pro pace de prova — puxa mais peso na recalibração do que qualquer treino normal.";
          const t=sumRanges(segTime(1.5,PACE_MIN.z2), segTime(10,PACE_MIN.z4));
          Tp.timeMin=Math.round(t[0]); Tp.timeMax=Math.round(t[1]);
          displayVol = Math.round(sessions.reduce((a,s)=>a+s.km,0)*10)/10; }
      }

      const BIKE_DAYS_W2 = ["Quinta","Sexta","Domingo"];
      const BIKE_DAYS_W3 = ["Segunda","Terça"];
      if(n===2){
        sessions.forEach(s=>{
          if(BIKE_DAYS_W2.includes(s.day)){
            s.title="🚴 Bike leve — recuperação cirúrgica"; s.type="easy"; s.zone="z2"; s.km=0;
            s.steps=["Sem corrida, sem musculação — cirurgia de 02/09","30-45min de bike estacionária/leve, esforço bem controlado, sem pressa","Se sentir tontura, dor de cabeça ou desconforto, para na hora"];
            s.note="Janela de recuperação (03 a 09/09). O objetivo aqui é circular sangue, não treinar.";
            s.shoe=null; s.timeMin=30; s.timeMax=45;
          }
        });
        displayVol = Math.round(sessions.reduce((a,s)=>a+s.km,0)*10)/10;
      }
      if(n===3){
        sessions.forEach(s=>{
          if(BIKE_DAYS_W3.includes(s.day)){
            s.title="🚴 Bike leve — recuperação cirúrgica"; s.type="easy"; s.zone="z2"; s.km=0;
            s.steps=["Ainda dentro da janela de recuperação","30-45min de bike leve, sem pressa"];
            s.note="Últimos dias antes de voltar a correr.";
            s.shoe=null; s.timeMin=30; s.timeMax=45;
          }
          if(s.day==="Quarta"){
            s.title="Retorno — corrida leve"; s.type="easy"; s.zone="z2"; s.km=Math.min(s.km,6);
            s.steps=[`${Math.min(s.km,6)} km bem leves, sem compromisso de pace`,"Primeiro treino de volta, antecipado — 7 dias exatos desde a cirurgia","Se sentir qualquer coisa estranha no corpo/rosto, para e volta pra bike"];
            s.note="Antecipado de sexta pra hoje. Testando o corpo, não cumprindo tabela.";
            const t=segTime(s.km,PACE_MIN.z2); s.timeMin=Math.round(t[0]); s.timeMax=Math.round(t[1]);
          }
          if(s.day==="Sexta"){
            s.title="Retorno — segundo teste"; s.type="easy"; s.zone="z2"; s.km=Math.min(s.km,7.5);
            s.steps=[`${Math.min(s.km,7.5)} km leves`,"Se quarta foi bem, um pouco mais de volume aqui — ainda sem pressa de pace"];
            s.note="Segundo dia de volta. Se quarta pesou, mantém curto igual; se foi tranquilo, esse aqui já pode render mais solto.";
            const t=segTime(Math.min(s.km,7.5),PACE_MIN.z2); s.timeMin=Math.round(t[0]); s.timeMax=Math.round(t[1]);
          }
          if(s.type==="long"){
            const reduced = Math.round(s.km*0.6*10)/10;
            s.title="Longão — retomada cautelosa"; s.km=reduced;
            s.steps=[`${reduced} km em Z2 — reduzido de propósito (era ${s.steps[0]})`,"Terceiro treino desde a volta. Se o corpo pedir, encurta ainda mais sem culpa."];
            s.note="Prioridade é voltar inteiro, não recuperar o km perdido de uma vez.";
            const t=segTime(reduced,PACE_MIN.z2); s.timeMin=Math.round(t[0]); s.timeMax=Math.round(t[1]);
          }
        });
        displayVol = Math.round(sessions.reduce((a,s)=>a+s.km,0)*10)/10;
      }

      out.push({ n, range:`${fmtD(ws)} – ${fmtD(we)}`, vol:displayVol, ph, sessions,
                 tag: (n===2||n===3) ? "RECUP." : (CHECKPOINT_WEEKS.includes(n) ? "CHECK" : (ph.id==="D"?"PICO": (ph.id==="E" ? (last?"PROVA":"TAPER") : null))),
                 isCheckpoint: CHECKPOINT_WEEKS.includes(n) });
      cur=addD(cur,7); n++;
    }
  });
  return out;
}

const DAY_ORDER = ["Segunda","Terça","Quarta","Quinta","Sexta","Sábado","Domingo"];

function getStrengthForWeek(freq){
  const pattern = PATTERNS[freq];
  const dayType = {};
  pattern.forEach(p=>{ dayType[p.d] = p.t; });

  const result = [];
  const freeDays = [];
  DAY_ORDER.forEach(day=>{
    const type = dayType[day];
    if(type==="quality"){
      result.push({ day, ...STRENGTH_ROUTINES.pullLeve, paired:"Intervalado Z5 · dia duro" });
    } else if(type==="tempo"){
      result.push({ day, ...STRENGTH_ROUTINES.rest, paired:"Limiar Z4 · dia duro", focus:"Dia protegido: o limiar é o treino mais exigente da semana" });
    } else if(type==="long"){
      result.push({ day, ...STRENGTH_ROUTINES.rest, paired:"Longão", focus:"Dia protegido pro longão" });
    } else {
      freeDays.push(day);
    }
  });

  const rotation = ["pushA","legs","pushB","pullB"];
  freeDays.forEach((day,i)=>{
    const key = rotation[i % rotation.length];
    const isNoRun = !dayType[day];
    result.push({ day, ...STRENGTH_ROUTINES[key], paired: isNoRun ? "Sem corrida" : "Regenerativo · fácil" });
  });

  return DAY_ORDER.map(day=>result.find(r=>r.day===day));
}

function getDayTier(week, day){
  const isLastWeek = week.n === WEEKS.length;
  if(isLastWeek && ["Quinta","Sexta","Sábado"].includes(day)) return "Carga de Carboidrato";

  const run = week.sessions.find(s=>s.day===day);
  const isTaperPhase = week.ph.id==="E";
  if(run && (run.type==="quality"||run.type==="tempo"||run.type==="long"||run.type==="race")){
    return isTaperPhase ? "Taper" : "Forte";
  }
  const sw = getStrengthForWeek(week.ph.freq);
  const str = sw.find(s=>s.day===day);
  if((run && run.type==="easy") || (str && str.ex.length>0)) return "Leve";
  return "Descanso";
}

// sequência de dias consecutivos com pelo menos um treino (corrida ou força) marcado concluído
function computeStreak(){
  const doneDates=new Set();
  WEEKS.forEach(w=>{
    w.sessions.forEach(s=>{ if(gd(w.n,s.day).done) doneDates.add(isoLocal(sessionDate(w.n,s.day))); });
    getStrengthForWeek(w.ph.freq).forEach(sd=>{ if(sd.ex.length>0 && gd(w.n,`M-${sd.day}`).done) doneDates.add(isoLocal(sessionDate(w.n,sd.day))); });
  });
  let cur=0, d=new Date(); d.setHours(0,0,0,0);
  while(doneDates.has(isoLocal(d))){ cur++; d=addD(d,-1); }
  const sorted=[...doneDates].sort();
  let best=0, run=0, prev=null;
  sorted.forEach(ds=>{
    const dt=new Date(ds+"T00:00:00");
    run = (prev && sameDay(addD(prev,1),dt)) ? run+1 : 1;
    best=Math.max(best,run); prev=dt;
  });
  return { current:cur, best };
}
function sparklineSVG(values, color){
  if(values.length<2) return "";
  const min=Math.min(...values), max=Math.max(...values), span=Math.max(1,max-min);
  const W=200,H=40;
  const pts=values.map((v,i)=>`${(i/(values.length-1)*W).toFixed(1)},${(H-((v-min)/span)*H).toFixed(1)}`).join(" L");
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><path d="M${pts}" fill="none" stroke="${color}" stroke-width="2"/></svg>`;
}

// insight automático: compara o que foi executado com a zona prescrita (pace + FC) e o volume planejado
function sessionInsight(r){
  if(r.paceDec==null) return null;
  const [pLo,pHi]=ZP[r.zone].split("–").map(paceToDec);
  const [fLo,fHi]=fcRange(r.zone);
  const fc=r.fc?parseInt(r.fc):null;
  const pad=0.05;
  const paceState = r.paceDec<pLo-pad ? "faster" : r.paceDec>pHi+pad ? "slower" : "in";
  const fcState = fc==null ? null : fc<fLo ? "low" : fc>fHi ? "high" : "in";
  if(fcState==="high" && paceState!=="slower"){
    return {tag:"warn", text:"FC acima da zona pro pace que rodou — calor, fadiga acumulada ou sono ruim. Considera puxar o próximo mais devagar."};
  }
  if(paceState==="faster" && fcState==="in"){
    return {tag:"good", text:"Mais rápido que a zona-alvo com FC controlada — bem executado, dá pra confiar nesse ritmo."};
  }
  if(paceState==="faster" && fcState==="low"){
    return {tag:"good", text:"Sobrou fôlego nesse ritmo — talvez dê pra empurrar um pouco mais na próxima."};
  }
  if(paceState==="slower" && fcState!=="low" && fcState!=null){
    return {tag:"info", text:"Ritmo mais lento que a zona com esforço normal/alto — pode ser calor, terreno ou fadiga acumulada, não necessariamente perda de forma."};
  }
  if(r.plannedKm>0 && r.realKm<r.plannedKm*0.85){
    return {tag:"info", text:`Rodou ${Math.round((1-r.realKm/r.plannedKm)*100)}% a menos que o planejado — treino cortado ou dia mais curto de propósito?`};
  }
  if(r.plannedKm>0 && r.realKm>r.plannedKm*1.12){
    return {tag:"info", text:"Passou bem do planejado — ótimo se foi intencional, mas cuidado pra não acumular fadiga fora do script."};
  }
  return {tag:"good", text:"Dentro da zona prescrita — execução alinhada com o plano."};
}

    const pct = r.plannedKm>0 ? r.realKm/r.plannedKm : 1;
    const dayNum = String(r.date.getDate()).padStart(2,"0");
    const insight=sessionInsight(r);
    const insColor = insight?.tag==="good" ? "var(--ok)" : insight?.tag==="warn" ? "var(--z5)" : "var(--text-3)";
    h+=`<div class="logrow" style="align-items:flex-start">
      ${ringSVG(pct, c, dayNum)}
      <div class="logrow-main">
        <div class="logrow-top">
          <span class="card-title" style="font-size:12.5px;display:flex;align-items:center;gap:5px">${T.iconName?`<span style="color:${c}">${icon(T.iconName,12)}</span>`:""}${esc(T.text)}</span>
          <span class="logrow-meta">${r.short} · S${r.week}</span>
        </div>
        <div class="logrow-stats">
          <span class="logrow-pace" style="color:${c}">${r.pace?`${r.pace}/km`:`${r.realKm}km`}</span>
          <span class="logrow-sub">${r.realKm}${r.plannedKm>0?`/${r.plannedKm}`:""}km${r.fc?` · FC ${r.fc}`:""}</span>
          ${delta}
        </div>
        ${insight?`<div style="font-size:10px;color:${insColor};margin-top:5px;line-height:1.5">${esc(insight.text)}</div>`:""}
      </div>
    </div>`;
  });
  return `<div class="logrows">${h}</div>`;
}

// ── Carga de treino — fitness/fadiga/forma (CTL/ATL/TSB) a partir do Relative Effort do Strava ──
// lido a cada chamada (não cacheado): "store" é reatribuído quando os dados salvos chegam do servidor
function stravaLoad(){ return store.strava_load || {}; }
function zoneRateKm(zone){
  let sumRE=0,sumKm=0;
  WEEKS.forEach(w=>w.sessions.forEach(s=>{
    if(s.zone!==zone) return;
    const d=gd(w.n,s.day);
    if(d.load && d.realKm){ sumRE+=d.load; sumKm+=d.realKm; }
  }));
  const defaults={z2:15,z3:18.5,z4:18,z5:18};
  return sumKm>0 ? sumRE/sumKm : defaults[zone];
}
function buildLoadSeries(){
  const loadMap=stravaLoad();
  // tudo até hoje é real (0 nos dias sem registro = descanso de verdade, não lacuna de sincronização);
  // só depois de hoje é que vira estimativa
  const cutoff=new Date(); cutoff.setHours(0,0,0,0);
  const series=[];
  for(let d=new Date(PLAN_START); d<=RACE_DATE; d=addD(d,1)){
    const key=isoLocal(d);
    let load=0, projected=false;
    if(d<=cutoff){
      load=loadMap[key]||0;
    } else {
      projected=true;
      const wd=weekDayFor(d);
      if(wd){
        const week=WEEKS.find(w=>w.n===wd.weekN);
        if(week){
          const sess=week.sessions.find(s=>s.day===wd.dayName);
          if(sess) load += sess.km>0 ? Math.round(sess.km*zoneRateKm(sess.zone)) : 6;
          const strengthDay=getStrengthForWeek(week.ph.freq).find(x=>x.day===wd.dayName);
          if(strengthDay && strengthDay.ex.length>0) load += 6;
        }
      }
    }
    series.push({ date:new Date(d), load, projected });
  }
  return series;
}
function computeFitness(series){
  const k42=1-Math.exp(-1/42), k7=1-Math.exp(-1/7);
  let ctl=0, atl=0;
  return series.map(pt=>{
    ctl = ctl + (pt.load-ctl)*k42;
    atl = atl + (pt.load-atl)*k7;
    return { ...pt, ctl:Math.round(ctl*10)/10, atl:Math.round(atl*10)/10, tsb:Math.round((ctl-atl)*10)/10 };
  });
}
function loadChartSVG(){
  const series=computeFitness(buildLoadSeries());
  const today=new Date();
  const W=680,H=210,padL=28,padR=10,padT=14,padB=24;
  const minDate=series[0].date, maxDate=series[series.length-1].date;
  const spanMs=Math.max(1,maxDate-minDate);
  const allVals=series.flatMap(p=>[p.ctl,p.atl,p.tsb]);
  const minV=Math.min(...allVals,0), maxV=Math.max(...allVals,10);
  const scaleX=d=>padL+((d-minDate)/spanMs)*(W-padL-padR);
  const scaleY=v=>H-padB-((v-minV)/(maxV-minV))*(H-padT-padB);
  const zeroY=scaleY(0);
  const cutoffIdx=series.findIndex(p=>p.projected);
  const splitX=cutoffIdx>=0 ? scaleX(series[cutoffIdx].date) : (W-padR);
  const line=key=>series.map((p,i)=>`${i===0?"M":"L"} ${scaleX(p.date).toFixed(1)} ${scaleY(p[key]).toFixed(1)}`).join(" ");
  const todayX=scaleX(today);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" style="overflow:visible">
    <line x1="${padL}" y1="${zeroY.toFixed(1)}" x2="${W-padR}" y2="${zeroY.toFixed(1)}" stroke="var(--line)" stroke-width="1"/>
    ${splitX<W-padR?`<rect x="${splitX.toFixed(1)}" y="${padT}" width="${(W-padR-splitX).toFixed(1)}" height="${H-padT-padB}" fill="var(--surface-2)" opacity="0.5"/>`:""}
    <path d="${line("tsb")}" fill="none" stroke="${ZC.z3}" stroke-width="1.5" opacity="0.85"/>
    <path d="${line("atl")}" fill="none" stroke="${ZC.z5}" stroke-width="1.5" opacity="0.85"/>
    <path d="${line("ctl")}" fill="none" stroke="var(--gold)" stroke-width="2.5"/>
    <line x1="${todayX.toFixed(1)}" y1="${padT}" x2="${todayX.toFixed(1)}" y2="${H-padB}" stroke="var(--text-3)" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="${todayX.toFixed(1)}" y="${padT-3}" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="var(--text-3)">hoje</text>
  </svg>`;
}
function volumeChartSVG(){
  const weeks=weeksStarted();
  if(!weeks.length) return `<div class="chart-empty"><div class="ce-ico">${icon("chart",22)}</div>Ainda sem semanas iniciadas.</div>`;
  const data=weeks.map(w=>({ n:w.n, planned:w.vol, actual:weeklyActualKm(w) }));
  const maxV=Math.max(...data.map(d=>Math.max(d.planned,d.actual)), 1);
  const W=680,H=190,padL=10,padR=10,padT=18,padB=26;
  const groupW=(W-padL-padR)/data.length;
  const barW=Math.min(22, groupW*0.26), gap=6;
  const scaleY=v=>(H-padB)-(v/maxV)*(H-padB-padT);
  let bars="";
  data.forEach((d,i)=>{
    const gx=padL+i*groupW+groupW/2;
    const x1=gx-gap/2-barW, x2=gx+gap/2;
    const yP=scaleY(d.planned), yA=scaleY(d.actual);
    bars+=`<rect x="${x1.toFixed(1)}" y="${yP.toFixed(1)}" width="${barW.toFixed(1)}" height="${((H-padB)-yP).toFixed(1)}" rx="3.5" fill="none" stroke="var(--text-3)" stroke-width="1.5"><title>Semana ${d.n} · planejado ${d.planned}km</title></rect>
      <rect x="${x2.toFixed(1)}" y="${yA.toFixed(1)}" width="${barW.toFixed(1)}" height="${((H-padB)-yA).toFixed(1)}" rx="3.5" fill="${d.actual>0?"var(--ok)":"var(--line)"}"><title>Semana ${d.n} · realizado ${d.actual}km</title></rect>
      ${d.actual>0?`<text x="${(x2+barW/2).toFixed(1)}" y="${(yA-6).toFixed(1)}" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8.5" fill="var(--text-2)">${d.actual}</text>`:""}
      <text x="${gx.toFixed(1)}" y="${H-8}" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="var(--text-3)">S${d.n}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" style="overflow:visible">
    <line x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}" stroke="var(--line)" stroke-width="1"/>
    ${bars}
  </svg>`;
}
function paceChartSVG(){
  const pts=z2PacePoints();
  if(pts.length<2) return `<div class="chart-empty"><div class="ce-ico">${icon("chart",22)}</div>Precisa de pelo menos 2 regenerativos/longões com pace registrado pra traçar a curva — hoje tem ${pts.length}.</div>`;
  const W=680,H=190,padL=14,padR=14,padT=18,padB=26;
  const minDate=pts[0].date, maxDate=pts[pts.length-1].date;
  const spanMs=Math.max(1,maxDate-minDate);
  const zoneLo=paceToDec(ZP.z2.split("–")[0]), zoneHi=paceToDec(ZP.z2.split("–")[1]);
  const paces=pts.map(p=>p.pace);
  const minP=Math.min(...paces,zoneLo)-0.2, maxP=Math.max(...paces,zoneHi)+0.2;
  const scaleX=d=>padL+((d-minDate)/spanMs)*(W-padL-padR);
  const scaleY=p=>H-padB-((p-minP)/(maxP-minP))*(H-padT-padB);
  const yZoneLo=scaleY(zoneLo), yZoneHi=scaleY(zoneHi);
  const pathD=pts.map((p,i)=>`${i===0?"M":"L"} ${scaleX(p.date).toFixed(1)} ${scaleY(p.pace).toFixed(1)}`).join(" ");
  let dots="";
  pts.forEach(p=>{
    const x=scaleX(p.date), y=scaleY(p.pace);
    dots+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="var(--gold)" stroke="var(--bg)" stroke-width="1.5"><title>${p.label} · ${p.paceStr}/km</title></circle>
      <text x="${x.toFixed(1)}" y="${(y-9).toFixed(1)}" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8.5" fill="var(--text-2)">${p.paceStr}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" style="overflow:visible">
    <rect x="${padL}" y="${Math.min(yZoneLo,yZoneHi).toFixed(1)}" width="${W-padL-padR}" height="${Math.abs(yZoneHi-yZoneLo).toFixed(1)}" fill="var(--z2)" opacity="0.1"/>
    <line x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}" stroke="var(--line)" stroke-width="1"/>
    <path d="${pathD}" fill="none" stroke="var(--z2)" stroke-width="2"/>
    ${dots}
  </svg>`;
}
function viewEvolution(){
  const weeks=weeksStarted();
  const totalPlanned=Math.round(weeks.reduce((a,w)=>a+w.vol,0));
  const totalActual=Math.round(weeks.reduce((a,w)=>a+weeklyActualKm(w),0)*10)/10;

  // pré-calcula tudo que os tiles do topo precisam
  const fitSeries=computeFitness(buildLoadSeries());
  const now=new Date();
  const lastReal=[...fitSeries].reverse().find(p=>sameDay(p.date,now)) || [...fitSeries].reverse().find(p=>!p.projected) || fitSeries[0];
  const ctlSpark=fitSeries.filter(p=>!p.projected).slice(-14).map(p=>p.ctl);
  const streak=computeStreak();
  const z2pts=z2PacePoints();
  const lastZ2=z2pts[z2pts.length-1], prevZ2=z2pts[z2pts.length-2];
  let z2Trend="";
  if(lastZ2 && prevZ2){
    const diff=Math.round((prevZ2.pace-lastZ2.pace)*60);
    if(diff!==0) z2Trend=`<span class="trend ${diff>0?"up":"down"}">${diff>0?"▼":"▲"} ${Math.abs(diff)}s</span> vs. anterior`;
  }

  let h=`<div class="section-head">

    <div class="section-note">${totalActual} km rodados de ${totalPlanned} km planejados até agora, em ${weeks.length} semana${weeks.length===1?"":"s"} já iniciada${weeks.length===1?"":"s"}.</div>
  </div>`;

  h+=`<div class="stattiles">
    <div class="stile hero">
      <div class="stile-lbl">Fitness agora</div>
      <div class="stile-val">${lastReal.ctl}</div>
      <div class="stile-sub">${lastReal.tsb>=0?`<span class="trend up">forma +${lastReal.tsb}</span>`:`<span class="trend down">forma ${lastReal.tsb}</span>`}</div>

    <div class="stile">

      <div class="stile-sub">recorde: ${streak.best}d</div>
    </div>
    <div class="stile">
      <div class="stile-lbl">Pace Z2</div>
      <div class="stile-val">${lastZ2?lastZ2.paceStr:"—"}<span class="u">${lastZ2?"/km":""}</span></div>
      <div class="stile-sub">${z2Trend||"sem comparação ainda"}</div>
    </div>
  </div>`;

  h+=`<div class="chartcard">
    <div class="chart-title">Treino a treino</div>
    <div class="chart-sub">Ordem cronológica · seta mostra se ficou mais rápido ou mais lento que o último do mesmo tipo (Z2/Z3/Z4/Z5)</div>
    ${sessionLogListHTML()}
  </div>`;

  h+=`<div class="chartcard">
    <div class="chart-title">Volume semanal</div>
    <div class="chart-sub">km por semana — contorno é o planejado, cheio é o que rodou de verdade</div>
    <div class="chart-legend">
      <span class="legend-item"><span class="legend-swatch ghost"></span>Planejado</span>
      <span class="legend-item"><span class="legend-swatch" style="background:var(--ok)"></span>Realizado</span>
    </div>
    ${volumeChartSVG()}
  </div>`;

  h+=`<div class="chartcard">
    <div class="chart-title">Pace regenerativo (Z2)</div>
    <div class="chart-sub">Cada ponto é um treino fácil ou longão registrado · faixa clara é a zona-alvo (${ZP.z2}/km)</div>
    ${paceChartSVG()}
  </div>`;
  const atRace=fitSeries[fitSeries.length-1];
  h+=`<div class="chartcard">
    <div class="chart-title">Carga de treino — fitness, fadiga e forma</div>
    <div class="chart-sub">Modelo de carga (impulso-resposta) a partir do Relative Effort do Strava · área sombreada é projeção, não treino real ainda</div>
    <div class="chart-legend">
      <span class="legend-item"><span class="legend-swatch" style="background:var(--gold)"></span>Fitness (CTL)</span>
      <span class="legend-item"><span class="legend-swatch" style="background:${ZC.z5}"></span>Fadiga (ATL)</span>
      <span class="legend-item"><span class="legend-swatch" style="background:${ZC.z3}"></span>Forma (TSB)</span>
    </div>
    ${loadChartSVG()}
    <div class="pacebox-note" style="margin-top:12px">
      Se você cumprir o plano dali pra frente, a projeção chega no dia da prova com fitness em torno de <b>${atRace.ctl}</b> e forma de <b>${atRace.tsb>0?"+":""}${atRace.tsb}</b> — ${atRace.tsb>=0?"forma positiva, exatamente o efeito esperado do taper: chegar fresco na largada.":"forma bem mais alta que durante o volume pesado — o taper reduz a fadiga acumulada mesmo sem cruzar pra positivo."}
    </div>
  </div>`;

  h+=`<div class="panel">
    <div class="panel-lbl" style="color:var(--gold)">Como isso é preenchido</div>

  </div>`;

  document.getElementById("content").innerHTML=h;
}

const TYPE_ICON = { easy:"wave", quality:"zap", tempo:"chart", long:"mountain", race:"flag" };
function cardHTML(s,wn){
  const c=ZC[s.zone], k=gk(wn,s.day), d=gd(wn,s.day);
  const done=!!d.done, open=S.open.has(k), edit=S.editing===k;
  const isToday=sameDay(sessionDate(wn,s.day), new Date());
  const T=titleWithIcon(s.title);
  const typeIco=T.iconName || TYPE_ICON[s.type];

  return `<div class="card ${done?"done":""}">
    <div class="card-head" data-t="${k}">
      <div class="zstripe" style="background:${c}"></div>
      <div class="card-main">
        <div class="card-toprow">
          <span class="daytag">${s.short}</span>
          ${typeIco?`<span style="color:${c}">${icon(typeIco,13)}</span>`:""}
          <span class="card-title">${esc(T.text)}</span>
          ${isToday?`<span class="todaypill">HOJE</span>`:""}
        </div>
        <div class="card-stats">
          <span class="stat-km">${s.km>0?`${s.km} km`:`${icon("bike",12)} bike`}</span>
          <span class="zpill" style="background:${c}1F;color:${c}">${ZL[s.zone]}</span>
          <span class="stat-pace" style="color:${c}">${ZP[s.zone]}/km</span>
          ${(s.timeMin!=null)?`<span style="font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--text-3)">${icon("clock",10)} ${fmtDuration(s.timeMin,s.timeMax)}</span>`:""}
        </div>
        ${s.shoe?`<div class="shoe-note">${icon("shoe",12)} ${esc(s.shoe)}</div>`:""}
      </div>
      <div class="card-right">
        <span class="chev ${open?"open":""}">▼</span>
        <button class="check ${done?"on":""}" data-done="${k}">${done?"✓":""}</button>
      </div>
    </div>
    <div class="card-body ${open?"open":""}">
      <div class="pacebox">
        <div class="pacebox-lbl">Alvo do treino</div>
        <div class="pacebox-row">
          <span class="pacebox-hr">FC ${ZHR[s.zone]} bpm</span>
          <span class="pacebox-pace" style="color:${c}">${ZP[s.zone]}<span class="u">/km</span></span>
        </div>
        ${(s.timeMin!=null)?`<div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:9px;padding-top:9px;border-top:1px solid var(--line)">
          <span class="pacebox-hr">Duração estimada</span>
          <span style="font-family:'Archivo',sans-serif;font-weight:800;font-size:16px;color:${c}">${fmtDuration(s.timeMin,s.timeMax)}</span>
        </div>`:""}
        ${s.note?`<div class="pacebox-note">${esc(s.note)}</div>`:""}
      </div>
      <div class="steps">
        ${s.steps.map(t=>`<div class="step"><span class="step-b" style="color:${c}">›</span><span>${esc(t)}</span></div>`).join("")}
      </div>
      ${logHTML(k,d,edit,c)}
    </div>
  </div>`;
}

function logHTML(k,d,edit,c){
  if(edit) return `<div class="editform">
    <div class="editrow">
      <input id="p-${k}" placeholder="Pace real · 5:45" value="${esc(d.pace||"")}">
      <input class="narrow" id="f-${k}" placeholder="FC média" value="${esc(d.fc||"")}">
    </div>
    <input id="n-${k}" placeholder="Temperatura, sensações, observações…" value="${esc(d.note||"")}">
    <div class="editbtns">
      <button class="btn-primary" data-save="${k}">Salvar registro</button>
      <button class="btn-ghost" data-cancel="${k}">Cancelar</button>
    </div>
  </div>`;
  if(d.pace||d.fc||d.note) return `<div class="logbox" data-edit="${k}"><div class="logbox-filled">
    ${d.pace?`Pace real <b style="color:${c}">${esc(d.pace)}/km</b><br>`:""}
    ${d.fc?`FC média <b style="color:${c}">${esc(d.fc)} bpm</b><br>`:""}
    ${d.note?`<span style="color:var(--text-3)">${esc(d.note)}</span>`:""}
  </div></div>`;
  return `<div class="logbox" data-edit="${k}"><div class="logbox-empty">+ Registrar pace, FC e como foi</div></div>`;
}

function wire(){
  document.querySelectorAll("[data-t]").forEach(e=>e.onclick=()=>{
    const k=e.dataset.t; S.open.has(k)?S.open.delete(k):S.open.add(k); render();
  });
  document.querySelectorAll("[data-done]").forEach(e=>e.onclick=ev=>{
    ev.stopPropagation();
    const [w,d]=e.dataset.done.match(/^w(\d+)_(.+)$/).slice(1);
    const cur=gd(+w,d); set(+w,d,{...cur,done:!cur.done}); render();
  });
  document.querySelectorAll("[data-edit]").forEach(e=>e.onclick=()=>{ S.editing=e.dataset.edit; render(); });
  document.querySelectorAll("[data-cancel]").forEach(e=>e.onclick=()=>{ S.editing=null; render(); });
  document.querySelectorAll("[data-save]").forEach(e=>e.onclick=()=>{
    const k=e.dataset.save, [w,d]=k.match(/^w(\d+)_(.+)$/).slice(1);
    set(+w,d,{ ...gd(+w,d),
      pace:document.getElementById(`p-${k}`).value,
      fc:document.getElementById(`f-${k}`).value,
      note:document.getElementById(`n-${k}`).value });
    S.editing=null; render();
  });
}

function viewStrength(){
  const week = WEEKS[S.wk];
  const wn = week.n;
  const strengthWeek = getStrengthForWeek(week.ph.freq);
  const hardDays = week.sessions.filter(s=>s.type==="quality"||s.type==="tempo").map(s=>s.day);
  let h=`<div class="section-head">
    <div class="section-eyebrow">Força · ABC / Push Pull Legs</div>
    <div class="section-title">5× por semana</div>
    <div class="section-note">Encaixado pra nunca competir com os dias de corrida mais duros dessa semana (${hardDays.join(" e ")}) — o intervalado e o limiar são eles que definem sua performance na prova.</div>
  </div>`;

  h+=`<div id="weekrail"><div class="row">`;
  WEEKS.forEach((w,i)=>{
    h+=`<button class="wk ${S.wk===i?"on":""}" data-wk="${i}"><div class="wk-n">S${w.n}</div><div class="wk-s">${w.tag||""}</div></button>`;
  });
  h+=`</div></div>`;

  strengthWeek.forEach(s=>{
    const has=s.ex.length>0, k=`M${wn}_${s.day}`;
    const d=gd(wn,`M-${s.day}`), done=has&&!!d.done, open=S.open.has(k);
    h+=`<div class="strcard ${!has?"rest":""} ${done?"done":""}">
      <div class="str-head" ${has?`data-t2="${k}"`:""} ${has?'style="cursor:pointer"':""}>
        <div class="str-code" ${!has?'style="color:var(--text-3)"':""}>${s.code}</div>
        <div class="str-main">
          <div class="str-title">${esc(s.title)}</div>
          <div class="str-paired">${s.day.toUpperCase()} · ${esc(s.paired)}</div>
        </div>
        ${has?`<div class="card-right">
          <span class="chev ${open?"open":""}">▼</span>
          <button class="check ${done?"on":""}" data-sdone="${wn}|${s.day}">${done?"✓":""}</button>
        </div>`:""}
      </div>
      ${has?`<div class="str-body ${open?"open":""}">
        <div class="str-focus">${esc(s.focus)}</div>
        ${s.ex.map(e=>`<div class="str-ex"><span style="color:var(--gold)">›</span><span>${esc(e)}</span></div>`).join("")}
        <div class="str-int">${esc(s.intensity)}</div>
      </div>`:`<div style="padding:0 16px 15px 73px;font-size:11px;color:var(--text-3);line-height:1.5">${esc(s.focus)}</div>`}
    </div>`;
  });

  const pullLeveDay = strengthWeek.find(s=>s.title==="Pull · leve");
  const tempoRestDay = strengthWeek.find(s=>s.paired==="Limiar Z4 · dia duro");
  const legsDay = strengthWeek.find(s=>s.title.startsWith("Legs"));
  const noRunDay = strengthWeek.find(s=>s.paired==="Sem corrida");
  const longRestDay = strengthWeek.find(s=>s.paired==="Longão");
  h+=`<div class="panel" style="margin-top:16px">
    <div class="panel-lbl" style="color:var(--gold)">Por que esse encaixe (semana ${wn})</div>
    <div class="panel-body">
      <b>${esc(pullLeveDay.day)}</b> carrega o intervalado (Z5) — leva só um pull leve.<br>
      <b>${esc(tempoRestDay.day)}</b> carrega o limiar (Z4) — fica sem musculação.<br>
      <b>Legs em ${esc(legsDay.day)}</b>, com volume reduzido: suas pernas já recebem carga alta da corrida, então aqui é complemento, não treino até a falha.<br>
      <b>${esc(noRunDay.day)}</b> é o único dia sem corrida essa semana — é onde dá pra ir mais forte.<br>
      <b>${esc(longRestDay.day)}</b> fica protegido pro longão.
    </div>
  </div>`;

  document.getElementById("content").innerHTML=h;
  document.querySelectorAll("[data-wk]").forEach(b=>b.onclick=()=>{ S.wk=+b.dataset.wk; render(); });
  document.querySelectorAll("[data-t2]").forEach(e=>e.onclick=()=>{
    const k=e.dataset.t2; S.open.has(k)?S.open.delete(k):S.open.add(k); render();
  });
  document.querySelectorAll("[data-sdone]").forEach(e=>e.onclick=ev=>{
    ev.stopPropagation();
    const [w,day]=e.dataset.sdone.split("|");
    const cur=gd(+w,`M-${day}`); set(+w,`M-${day}`,{...cur,done:!cur.done}); render();
  });

function mileagePanel(){
  const totals={}, counts={};
  WEEKS.forEach(w=>w.sessions.forEach(s=>{
    if(!s.shoe) return;
    totals[s.shoe]=(totals[s.shoe]||0)+s.km;
    counts[s.shoe]=(counts[s.shoe]||0)+1;
  }));
  const grand = Object.values(totals).reduce((a,b)=>a+b,0);
  const rows = Object.entries(totals).sort((a,b)=>b[1]-a[1]);
  let h=`<div class="panel">
    <div class="panel-lbl" style="color:var(--gold)">Km por tênis no ciclo (13 semanas)</div>
    <div class="panel-body">`;
  rows.forEach(([shoe,km])=>{
    const pct = (km/grand*100).toFixed(0);
    h+=`<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;gap:10px">
      <span>${esc(shoe)}</span>
      <span style="font-family:'JetBrains Mono',monospace;color:var(--text);white-space:nowrap"><b>${km.toFixed(0)}km</b> · ${counts[shoe]}× · ${pct}%</span>
    </div>`;
  });
  h+=`<div style="border-top:1px solid var(--line);margin-top:6px;padding-top:9px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text-3)">Total do ciclo: ${grand.toFixed(0)}km</div>
    </div>
  </div>`;
  return h;
}

function viewZones(){
  const zones=[
    { z:"Z1", hr:"< 126", pace:"> 7:00", name:"Recuperação", c:"#4A8B84", d:"Bem leve, quase trote. Regeneração pura." },
    { z:"Z2", hr:"127–157", pace:ZP.z2, name:"Aeróbio leve", c:ZC.z2, d:"Consegue conversar frases inteiras. É a base de tudo — longões e regenerativos." },

    { z:"Z4", hr:"174–188", pace:ZP.z4, name:"Limiar", c:ZC.z4, d:"Frases curtas, esforço controlado. Zona dos blocos de limiar." },
    { z:"Z5", hr:"189+", pace:ZP.z5, name:"Máximo", c:ZC.z5, d:"Sem conversa. Estímulos curtos e intensos." },
  ];
  let h=`<div class="section-head">
    <div class="section-eyebrow">Referência</div>
    <div class="section-title">Zonas de esforço</div>
  </div>`;
  zones.forEach(z=>{
    h+=`<div class="zonecard" style="border-color:${z.c}30">
      <div class="zonetop">
        <div class="zbadge" style="background:${z.c}1A;border:2px solid ${z.c}55;color:${z.c}">${z.z}</div>
        <div class="zinfo">
          <div class="zrow1">
            <span class="zname">${z.name}</span>
            <span class="zpace" style="color:${z.c}">${z.pace}<span class="u">/km</span></span>
          </div>
          <div class="zhr">FC ${z.hr} bpm</div>
          <div class="zdesc">${z.d}</div>
        </div>
      </div>
    </div>`;
  });
  const raceMid = ((paceToDec(ZP.z3.split("–")[0]) + paceToDec(ZP.z3.split("–")[1])) / 2);
  const raceTimeMid = raceMid * 21.1;
  const raceLo = paceToDec(ZP.z3.split("–")[0]) * 21.1;
  const raceHi = paceToDec(ZP.z3.split("–")[1]) * 21.1;
  h+=`<div class="panel" style="border-color:#B98CE855;background:linear-gradient(135deg,#B98CE812,transparent)">
    <div class="panel-lbl" style="color:#B98CE8">${icon("refresh",12)} Ritmo atual projetado pra prova — campo vivo</div>
    <div class="panel-body">
      Pace de prova hoje: <b>${ZP.z3}/km</b> → projeção de <b>${minToHM(raceLo)} a ${minToHM(raceHi)}</b> (meio-termo ~${minToHM(raceTimeMid)}).<br><br>
      Esse número <b>não é fixo</b> — ele atualiza a cada checkpoint (S5, S8, S11) e principalmente depois dos testes de 5K (S5) e 10K (S9). Não é "o pace de novembro definido hoje", é a melhor estimativa com o dado que existe agora.
    </div>
  </div>`;

  {
    const pr=bestKnownPR();
    const vdot=vdotFromPerformance(pr.distKm, pr.timeSec);
    const riegelHalf=riegelPredict(pr.distKm, pr.timeSec, 21.1);
    const riegel10k=riegelPredict(pr.distKm, pr.timeSec, 10);
    const vdotHalf=timeForDistanceAtVDOT(vdot, 21.1);
    const vdot10k=timeForDistanceAtVDOT(vdot, 10);
    h+=`<div class="panel" style="border-color:${ZC.z4}40">
      <div class="panel-lbl" style="color:${ZC.z4}">${icon("ruler",12)} Previsão por fórmula — sem comparar com outros atletas</div>
      <div class="panel-body">
        Baseado só em <b>${pr.source}</b> — nenhum dado de população do Strava entra aqui, só duas fórmulas matemáticas aplicadas ao seu próprio desempenho:<br><br>
        <b>Riegel</b> <span style="color:var(--text-3)">(T₂=T₁·(D₂/D₁)^1.06)</span> → meia maratona em <b style="color:${ZC.z4}">${fmtHMS(riegelHalf)}</b> · 10K em <b>${fmtHMS(riegel10k)}</b><br>
        <b>VDOT</b> <span style="color:var(--text-3)">(modelo fisiológico de Jack Daniels, VDOT ${vdot.toFixed(1)})</span> → meia maratona em <b style="color:${ZC.z4}">${fmtHMS(vdotHalf)}</b> · 10K em <b>${fmtHMS(vdot10k)}</b><br><br>
        As duas convergem perto de ${minToHM((riegelHalf+vdotHalf)/2/60)} pra meia — mais rápido que o pace-alvo atual do plano (${minToHM(raceLo)}–${minToHM(raceHi)}). Isso é esperado, não é a previsão "certa": é uma extrapolação de <b>4× a distância</b> a partir de um único 5K, sem saber se sua resistência aeróbica aguenta o ritmo por 21km. Fórmula nenhuma sabe disso — só teste real mostra. O teste de 10K (Semana 9) reduz a extrapolação pra 2× e aperta bastante essa previsão pra mais perto da realidade.
      </div>
    </div>`;
  }

  h+=`<div class="panel" style="border-color:${ZC.z2}30">
    <div class="panel-lbl" style="color:${ZC.z2}">Sobre esses paces</div>
    <div class="panel-body">Recalibrados depois do seu PR de 5K (24:39). Esses números já consideram o calor de Brasília — o PR foi corrido a ~20°C no Rio, bem mais fresco que os 26–31°C daqui. Trate como provisório até validar em treino normal na cidade.</div>

  </div>`;
  document.getElementById("content").innerHTML=h;
}
